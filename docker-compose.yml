services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Log output appears immediately in `docker compose logs` instead of being
      # buffered until the container's stdout pipe fills up.
      - PYTHONUNBUFFERED=1
      # Don't write .pyc files into the bind-mounted source below — they'd be
      # compiled for the container's Python/architecture and pollute the host tree.
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      # Bind-mount the source so edits on the host are picked up without rebuilding
      # the image. Dependencies are installed into the image's site-packages, not
      # under /app, so this mount can't shadow them.
      - ./backend:/app
    # main.py already runs uvicorn with reload=True; reuse it here instead of the
    # Dockerfile's non-reloading production CMD.
    command: python main.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      # Read by Vite when the dev server starts. This is fetched by the browser
      # on the host, not by the container, so it must be the host-reachable
      # URL — the in-network service name "backend" wouldn't resolve there.
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      # Bind-mount the source so edits on the host are picked up without rebuilding
      # the image.
      - ./frontend:/app
      # Anonymous volume so the bind mount above doesn't shadow node_modules,
      # which was installed into the image during build.
      - /app/node_modules
    depends_on:
      - backend
    # --host binds to 0.0.0.0; package.json's bare `vite` binds to localhost
    # only, which isn't reachable from outside the container.
    command: npm run dev -- --host 0.0.0.0
